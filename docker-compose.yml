services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: ./planner-backend/dev.Dockerfile
    ports:
      - '8080:8080'
    volumes:
      - ./api:/app
    # web:
    # todo

volumes:
  web_node_modules:
  postgres_data:
